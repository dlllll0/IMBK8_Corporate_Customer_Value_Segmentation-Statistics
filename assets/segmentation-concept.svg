<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">FAI FPI segmentation concept</title><desc id="desc">Concept only. Median cutoffs define Cash Cow, Star, Standard and Potential. No customer data.</desc>
<rect width="1000" height="680" fill="#f8fafc"/>
<g font-family="Malgun Gothic, sans-serif" fill="#16324f">
<text x="70" y="60" font-size="30" font-weight="700">활동성과 추정 수익성으로 보는 고객 세분화</text>
<text x="70" y="94" font-size="17" fill="#566779">분류 규칙 개념도 · 실제 관측값 및 성과 수치 미포함</text>
<rect x="155" y="145" width="340" height="200" rx="8" fill="#dcf2ea"/>
<rect x="515" y="145" width="340" height="200" rx="8" fill="#dcebf9"/>
<rect x="155" y="365" width="340" height="200" rx="8" fill="#edf0f4"/>
<rect x="515" y="365" width="340" height="200" rx="8" fill="#fff0d3"/>
<text x="185" y="198" font-size="27" font-weight="700">알짜 · Cash Cow</text>
<text x="185" y="239" font-size="20">낮은 활동성 / 높은 수익성</text>
<text x="185" y="291" font-size="16">FAI &lt; 중앙값, FPI ≥ 중앙값</text>
<text x="545" y="198" font-size="27" font-weight="700">스타 · Star</text>
<text x="545" y="239" font-size="20">높은 활동성 / 높은 수익성</text>
<text x="545" y="291" font-size="16">FAI ≥ 중앙값, FPI ≥ 중앙값</text>
<text x="185" y="418" font-size="27" font-weight="700">일반 · Standard</text>
<text x="185" y="459" font-size="20">낮은 활동성 / 낮은 수익성</text>
<text x="185" y="511" font-size="16">FAI &lt; 중앙값, FPI &lt; 중앙값</text>
<text x="545" y="418" font-size="27" font-weight="700">잠재 · Potential</text>
<text x="545" y="459" font-size="20">높은 활동성 / 낮은 수익성</text>
<text x="545" y="511" font-size="16">FAI ≥ 중앙값, FPI &lt; 중앙값</text>
<path d="M130 145 V590 H855" fill="none" stroke="#516579" stroke-width="2"/>
<text x="430" y="625" font-size="20">활동성 FAI →</text>
<text transform="translate(95 445) rotate(-90)" font-size="20">추정 수익성 FPI →</text>
<text x="155" y="660" font-size="15" fill="#566779">고저는 표본 내 상대적 구분이며, 기존 고객등급·신용위험·실현 수익과 다릅니다.</text>
</g></svg>
